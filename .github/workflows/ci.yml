name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .

      - name: Verify installed package
        run: |
          python -m ppmi_pipeline --version
          ppmi-pipeline --version

      - name: Run test suite
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests -v

      - name: Verify overlap guard under optimized Python
        run: python -O -m unittest discover -s tests -p "test_validation.py" -v
