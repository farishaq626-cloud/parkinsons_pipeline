[build-system]
requires = ["setuptools==80.10.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ppmi-pipeline"
version = "2.1.7"
description = "Auditable fixed-horizon data-engineering and validation framework for longitudinal PPMI data."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12,<3.15"
license = "MIT"
authors = [
  { name = "Faris Haq" },
]
keywords = [
  "PPMI",
  "longitudinal-data",
  "reproducible-research",
  "data-engineering",
  "patient-isolated-validation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy==2.4.6",
  "pandas==3.0.3",
  "scikit-learn==1.9.0",
  "openpyxl==3.1.5",
  "matplotlib==3.11.0",
  "seaborn==0.13.2",
  "qrcode[pil]==8.2",
  "pillow==12.3.0",
]

[project.optional-dependencies]
dev = [
  "ruff==0.16.0",
]

[project.urls]
Homepage = "https://github.com/farishaq626-cloud/parkinsons_pipeline"
Repository = "https://github.com/farishaq626-cloud/parkinsons_pipeline"
Archive = "https://doi.org/10.5281/zenodo.21225810"
Issues = "https://github.com/farishaq626-cloud/parkinsons_pipeline/issues"

[project.scripts]
ppmi-pipeline = "ppmi_pipeline.cli:main"

[tool.setuptools]
py-modules = [
  "adapter",
  "config",
  "data_utils",
  "etl",
  "exceptions",
  "logging_config",
  "main",
  "modeling",
  "validation",
  "visualization",
]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["ppmi_pipeline*", "poster_assets*"]
exclude = ["legacy*", "tests*", "manuscript*"]

[tool.setuptools.package-data]
ppmi_pipeline = ["sample_data/*.csv"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
  ".venv*",
  "build",
  "legacy",
  "manuscript",
  "poster_build",
  "results",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
